server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  websocket:
    allowed-origins: "*"

app:
  ia:
    base-url: ${IA_SERVICE_URL:http://ia-service:8000}
    timeout-connect-ms: 2000
    timeout-read-ms: 5000
  rate-limit:
    fps: 5
  persistencia:
    habilitada: true
  filtro:
    classes-relevantes:
      - person
      - chair
      - dining table
      - door
      - stairs
      - car
      - cell phone
      - backpack

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.visaoassistiva: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY:}
  voice-id: ${ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}
  model: ${ELEVENLABS_MODEL:eleven_multilingual_v2}